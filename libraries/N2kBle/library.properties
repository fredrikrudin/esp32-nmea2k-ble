name=N2kBle
version=0.2.0
author=Fredrik Rudin
maintainer=Fredrik Rudin <fredrik.rudin@outlook.com>
sentence=NMEA 2000 over Bluetooth Low Energy: an ESP32 CAN-bus bridge and a client that maps any PGN to your functions.
paragraph=Core of nmea2k-ble-libraries. The bridge streams every NMEA 2000 message (fast-packets reassembled) over BLE to up to 4 clients, each with its own PGN filter. Clients get a normal tN2kMsg, so all ParseN2k functions work. Pairing with passkey, address binding, event log (RAM / SD), settings in NVS and a serial console. Sending: N2kBleTx. Web page: N2kBleWeb.
category=Communication
url=https://github.com/fredrikrudin/nmea2k-ble-libraries
architectures=esp32
includes=N2kBle.h
depends=NimBLE-Arduino (>=2.3.0), NMEA2000-library
